<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon tableau de bord quotidien</title>

  <!-- PWA : Manifest + icônes -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="#7c5a9e">

    <!-- OneSignal : Notifications push -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "616a6333-c0c9-48b8-9ed9-bd58b6eb3414",
        serviceWorkerPath: "onesignal/OneSignalSDKWorker.js",
        serviceWorkerParam: { scope: "/onesignal/" }
      });

      // Identifiant unique de l'utilisateur (généré une seule fois, stocké dans le navigateur)
      let userId = localStorage.getItem("carnet-user-id");
      if (!userId) {
        userId = "user-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8);
        localStorage.setItem("carnet-user-id", userId);
      }
      await OneSignal.login(userId);

      // Envoie le prénom si déjà configuré
      try {
        const perso = JSON.parse(localStorage.getItem("carnet-esther-perso-v1") || "{}");
        if (perso.prenom) {
          await OneSignal.User.addTag("prenom", perso.prenom);
        }
      } catch (e) { /* ignore */ }

      await OneSignal.Slidedown.promptPush();
    });
  </script>
  <link rel="stylesheet" href="style.css">

  <!-- ═══════════════════════════════════════════
       PAGE 0 — BIENVENUE

      <div class="hero-bottom">
        <p class="hero-sub">
          Configuration de l'espace<br>en 3 clics
        </p>

        <button class="btn-hero-arrow" id="btn-voir-config" aria-label="Continuer">

        </button>

            </span>

        </div>
      </div>

  <!-- ═══════════════════════════════════════════
       PANNEAU D'ÉDITION D'UN CRÉNEAU
       ═══════════════════════════════════════════ -->
  <div id="edit-modal" class="modal hidden">
    <div class="modal-content">
      <h3 id="modal-title">Modifier le créneau</h3>

      <label for="edit-time">Heure</label>
      <input type="text" id="edit-time" placeholder="ex. 4h30" enterkeyhint="next">

      <label for="edit-cat">Catégorie</label>
      <select id="edit-cat">
        <option value="spiritualite">Spiritualité</option>
        <option value="cours">Cours</option>
        <option value="revision">Révision</option>
        <option value="auto-formation">Auto-formation</option>
        <option value="organisation">Organisation</option>
        <option value="actualite">Actualité</option>
        <option value="lecture">Lecture</option>
        <option value="sport">Sport</option>
      </select>

      <label for="edit-text">Description</label>
      <input type="text" id="edit-text" placeholder="ex. Méditation de la Parole — 20 min" enterkeyhint="done">

      <div class="modal-actions">
        <button id="modal-delete" class="btn-danger">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0"/></svg>
          Supprimer
        </button>
        <button id="modal-cancel" class="btn-secondary">Annuler</button>
        <button id="modal-ok" class="btn-primary">OK</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>

  <!-- PWA : Enregistrement du Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js')
          .then(() => console.log('✅ Service Worker enregistré'))
          .catch((err) => console.warn('⚠️ Service Worker échec:', err));
      });
    }
  </script>
